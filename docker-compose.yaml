services:
  web:
    build: .
    image: api:1.0
    container_name: fastapi_app
    
    env_file:
    - .env

    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: db_games
      MYSQL_USER: db_user
      MYSQL_PASSWORD: db_password

    ports:
      - '8000:8000'
    
    depends_on:
      db:
        condition: service_healthy
    
    volumes:
      - .:/app
    
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

    restart: always

  db:
    image: mysql:8.4
    container_name: mysql_db
    
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: db_games
      MYSQL_USER: db_user
      MYSQL_PASSWORD: db_password
    
    ports:
      - '3307:3306'
    
    volumes:
      - mysqldata:/var/lib/mysql
      - ./bd/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: always

volumes:
  mysqldata:
    driver: local
